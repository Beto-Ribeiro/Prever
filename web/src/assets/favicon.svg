<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Íris PREVER</title>
  <desc id="desc">Íris circular com anéis de monitoramento, pontos de sinal e feixe de radar.</desc>
  <defs>
    <clipPath id="iris-clip">
      <circle cx="256" cy="256" r="202"/>
    </clipPath>
  </defs>

  <!-- A área fora deste círculo permanece transparente. -->
  <circle cx="256" cy="256" r="224" fill="#0A162E"/>
  <circle cx="256" cy="256" r="202" fill="#18395C"/>
  <circle cx="256" cy="256" r="160" fill="none" stroke="#A6C1D4" stroke-width="12"/>
  <circle cx="256" cy="256" r="92" fill="#0A162E" stroke="#A6C1D4" stroke-width="8"/>

  <g clip-path="url(#iris-clip)">
    <path d="M256 256 L421 365 L360 443 Z" fill="#A6C1D4" opacity="0.78"/>
    <path d="M256 256 L360 443 L310 458 Z" fill="#E4E6E8" opacity="0.64"/>
    <path d="M256 256 L421 365 L392 404 Z" fill="#44769B" opacity="0.55"/>
  </g>

  <circle cx="256" cy="256" r="14" fill="#F7FBFF"/>
  <circle cx="344" cy="131" r="14" fill="#F7FBFF"/>
  <circle cx="414" cy="274" r="14" fill="#F7FBFF"/>
  <circle cx="101" cy="304" r="14" fill="#F7FBFF"/>
</svg>
